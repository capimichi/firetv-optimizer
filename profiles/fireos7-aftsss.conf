# Profile: Amazon Fire TV Stick Lite / 3rd Gen (Model: AFTSSS - Sheldon/Sheldonp)
# Target OS: Fire OS 7 (Android 9 Pie)
# Description: Specific debloat and performance configuration for 1GB RAM budget Fire TV Sticks

PROFILE_NAME="Fire TV Stick Lite / 3rd Gen (AFTSSS - Fire OS 7)"
PROFILE_VERSION="1.0.0"

# Bloatware packages safe to disable on Fire OS 7 without breaking core UI / remotes / streaming apps
BLOAT_PACKAGES=(
  # Live TV recommendations & continuous channel guide scraping
  "com.amazon.tv.livetv"

  # Whole Home Audio Daemon (Alexa multiroom speaker sync)
  "com.amazon.whad"

  # System screensaver (consumes ~140MB RAM in background)
  "com.amazon.ftv.screensaver"

  # Amazon telemetry and background metrics
  "com.amazon.tv.fw.metrics"
  "com.amazon.wirelessmetrics.service"

  # Amazon Shopping & secondary commercial services
  "com.amazon.shoptv.firetv.client"
  "com.amazon.device.sale.service"

  # Amazon Freevee / MiniTV streaming bloat
  "com.amazon.imdb.tv.android.app"
  "com.amazon.minitv.android.app"

  # Whisperjoin middleware
  "com.amazon.whisperjoin.middleware.np"

  # Alexa communication / Kindle connect
  "com.amazon.aca"
  "com.amazon.ods.kindleconnect"
)

# Animation speeds (0.0 = completely disabled for maximum responsiveness)
WINDOW_ANIMATION_SCALE="0.0"
TRANSITION_ANIMATION_SCALE="0.0"
ANIMATOR_DURATION_SCALE="0.0"

# Privacy & Tracking settings
LIMIT_AD_TRACKING=1
DISABLE_METRICS_UPLOAD=1

# Clean leftover APK downloads
CLEAN_DOWNLOADS=1

# Safe cache trim threshold (bytes)
CACHE_TRIM_BYTES="20000000000"
